name: CI

on:
  push:
    branches: [main]
  pull_request:
  # So a red main can be re-checked without an empty commit.
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # package.json declares >=20; this is what Vercel resolves to.
          node-version: "20.x"
          cache: npm

      # ci, not install: it installs exactly the lockfile and fails loudly if
      # package.json and the lock have drifted apart. That drift is what breaks
      # a deployment build after a dependency change lands without the lock.
      - run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      # CI=true turns warnings into errors, so an unused import cannot reach a
      # deployment. This is the same build Vercel runs.
      - name: Build
        run: npm run build
        env:
          CI: true
